<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SpeakFlow</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="app">

    <section class="card">
        <header class="card-header">
            <h1>SpeakFlow</h1>
            <p>Convertor de texto en voz de forma rápida y sencilla.</p>
        </header>
        <section class="controls">
            <textarea id="ingresa" class="areadetexto" placeholder="Escribe aquí tu texto">
        </textarea>
        <div class="stats">
            <span id="contador"> 0 caracteres </span>
            <span id="tiempo">  0 min lectura</span>
        </div>
            <div class="buttons">
        <button id="reproducir">
            ▶ Reproducir
        </button>
        <button id="pausar">
            ⏸ Pausar
        </button>
        <button id="continuar">
            ▶⏸ continuar
        </button>
        <button id="detener">
            ■ Detener
        </button>
            </div>
        </section>
    </section>
</main>
        <script src="js/speech.js"></script>
        <script src="js/app.js"></script>
</body>
</html>
